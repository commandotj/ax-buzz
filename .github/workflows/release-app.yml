name: Buzz.app release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buzz-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require version tag on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit reachable from main."
            exit 1
          fi
          VERSION="$(node tools/version.mjs read "$GITHUB_SHA")"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match synchronized source version $VERSION."
            exit 1
          fi

  build-dmg:
    name: Build ${{ matrix.arch }} DMG
    needs: [validate-tag]
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            mac_arch: arm64
            runner: macos-15
          - arch: amd64
            mac_arch: x86_64
            runner: macos-15-intel
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
      APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      NOTARY_PROFILE: buzz-notarization
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.6'
          cache-dependency-path: '**/go.sum'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check synchronized source versions
        run: pnpm check:version

      - name: Install Wails CLI
        run: pnpm setup:wails

      - name: Add Go binaries to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check signing secrets
        shell: bash
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_NOTARY_API_KEY_ID \
            APPLE_NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing release environment secret: $name"
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            exit 1
          fi
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application:"*"($APPLE_TEAM_ID)" ]]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity for the configured Team ID."
            exit 1
          fi

      - name: Import Developer ID certificate and verify notary login
        shell: bash
        run: |
          set +x
          KEYCHAIN_PATH="$RUNNER_TEMP/buzz-signing.keychain-db"
          KEYCHAIN_PASSWORD="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-buzz"
          CERTIFICATE_PATH="$RUNNER_TEMP/buzz-signing.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_API_KEY_ID}.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          if ! grep -F -- "$APPLE_SIGNING_IDENTITY" <<< "$identities"; then
            echo "::error::Developer ID identity with private key is missing or invalid."
            exit 1
          fi
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 -D -o "$NOTARY_KEY_PATH"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_API_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$NOTARY_KEY_PATH"
          xcrun notarytool history --keychain-profile "$NOTARY_PROFILE"

      - name: Build app with bundled CLI
        run: pnpm --filter @buzz/desktop build

      - name: Verify release version and architecture
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.mac_arch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP="apps/desktop/bin/Buzz.app"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          CLI_VERSION="$(apps/cli/bin/buzz --version)"
          if [[ "v$APP_VERSION" != "$RELEASE_TAG" || "$CLI_VERSION" != "$RELEASE_TAG" ]]; then
            echo "::error::App and bundled CLI versions must both match $RELEASE_TAG."
            exit 1
          fi
          for binary in "$APP/Contents/MacOS/Buzz" "$APP/Contents/Resources/buzz"; do
            archs="$(lipo -archs "$binary")"
            if [[ "$archs" != "$EXPECTED_MAC_ARCH" ]]; then
              echo "::error::Unexpected architecture for $binary: $archs"
              exit 1
            fi
          done

      - name: Sign and notarize app
        run: >-
          wails3 tool sign
          --input apps/desktop/bin/Buzz.app
          --identity "$APPLE_SIGNING_IDENTITY"
          --notarize
          --keychain-profile "$NOTARY_PROFILE"

      - name: Verify signed app
        run: |
          codesign --verify --deep --strict --verbose=2 apps/desktop/bin/Buzz.app
          signature="$(codesign -dv --verbose=4 apps/desktop/bin/Buzz.app 2>&1)"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature"
          spctl --assess --type execute --verbose=2 apps/desktop/bin/Buzz.app

      - name: Create DMG from signed app
        working-directory: apps/desktop
        run: wails3 task darwin:create:dmg

      - name: Notarize and staple DMG
        run: |
          DMG="apps/desktop/bin/Buzz.dmg"
          xcrun notarytool submit "$DMG" --keychain-profile "$NOTARY_PROFILE" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          hdiutil verify "$DMG"

      - name: Verify mounted DMG contents
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.mac_arch }}
        run: |
          DMG="$GITHUB_WORKSPACE/apps/desktop/bin/Buzz.dmg"
          MOUNT_POINT="$RUNNER_TEMP/buzz-dmg"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT_POINT"
          detach_dmg() {
            hdiutil detach "$MOUNT_POINT" -quiet || true
          }
          trap detach_dmg EXIT
          test -d "$MOUNT_POINT/Buzz.app"
          test -L "$MOUNT_POINT/Applications"
          test "$(readlink "$MOUNT_POINT/Applications")" = "/Applications"
          app_archs="$(lipo -archs "$MOUNT_POINT/Buzz.app/Contents/MacOS/Buzz")"
          cli_archs="$(lipo -archs "$MOUNT_POINT/Buzz.app/Contents/Resources/buzz")"
          test "$app_archs" = "$EXPECTED_MAC_ARCH"
          test "$cli_archs" = "$EXPECTED_MAC_ARCH"
          codesign --verify --deep --strict "$MOUNT_POINT/Buzz.app"

      - name: Upload architecture DMG
        run: mv "apps/desktop/bin/Buzz.dmg" "apps/desktop/bin/Buzz-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.dmg"

      - name: Upload architecture DMG artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buzz-dmg-${{ matrix.arch }}
          path: apps/desktop/bin/Buzz-${{ github.ref_name }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 3

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/buzz-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/buzz-signing.p12"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  publish-release:
    name: Publish GitHub Release
    needs: [build-dmg]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated DMGs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: buzz-dmg-*
          path: release-assets
          merge-multiple: true

      - name: Create or recover draft release and publish DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARM64_DMG="release-assets/Buzz-${RELEASE_TAG}-macos-arm64.dmg"
          AMD64_DMG="release-assets/Buzz-${RELEASE_TAG}-macos-amd64.dmg"
          test -f "$ARM64_DMG"
          test -f "$AMD64_DMG"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Buzz ${RELEASE_TAG}" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$ARM64_DMG" "$AMD64_DMG" --clobber
          sha_arm64="$(sha256sum "$ARM64_DMG" | awk '{print $1}')"
          sha_amd64="$(sha256sum "$AMD64_DMG" | awk '{print $1}')"
          gh release view "$RELEASE_TAG" --json body --jq '.body' > "$RUNNER_TEMP/release-notes-base.md"
          sed '/^SHA-256 checksums:/,$d' "$RUNNER_TEMP/release-notes-base.md" > "$RUNNER_TEMP/release-notes.md"
          printf '\nSHA-256 checksums:\n- Buzz-%s-macos-arm64.dmg: %s\n- Buzz-%s-macos-amd64.dmg: %s\n' \
            "$RELEASE_TAG" "$sha_arm64" "$RELEASE_TAG" "$sha_amd64" >> "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false --title "Buzz ${RELEASE_TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"

  verify-release:
    name: Verify public release assets
    needs: [publish-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - name: Verify DMG-only release contents
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets | jq -e --arg tag "$RELEASE_TAG" '
            .tagName == $tag and .isDraft == false and
            ([.assets[].name] | sort) == ["Buzz-\($tag)-macos-amd64.dmg", "Buzz-\($tag)-macos-arm64.dmg"]
          ' >/dev/null
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "Verified public DMG assets for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"

  update-homebrew-cask:
    name: Open Homebrew Cask PR
    needs: [verify-release]
    if: needs.verify-release.outputs.verified == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require tap token
        env:
          HOMEBREW_CASK_TOKEN: ${{ secrets.HOMEBREW_CASK_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_CASK_TOKEN" ]]; then
            echo "::error::Configure HOMEBREW_CASK_TOKEN with Contents and Pull requests write access to systembugtj/luban-homebrew."
            exit 1
          fi

      - name: Check out Buzz release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download public DMGs and verify release checksums
        id: checksums
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_CASK_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buzz-assets"
          release_body="$(curl --fail --location --silent --show-error \
            "https://api.github.com/repos/commandotj/ax-buzz/releases/tags/${RELEASE_TAG}" \
            -H 'Accept: application/vnd.github+json' | jq -r '.body')"
          for arch in arm64 amd64; do
            name="Buzz-${RELEASE_TAG}-macos-${arch}.dmg"
            curl --fail --location --silent --show-error \
              "https://github.com/commandotj/ax-buzz/releases/download/${RELEASE_TAG}/${name}" \
              --output "$RUNNER_TEMP/buzz-assets/$name"
            expected_sha="$(printf '%s\n' "$release_body" | sed -n "s/^- ${name}: //p")"
            actual_sha="$(sha256sum "$RUNNER_TEMP/buzz-assets/$name" | awk '{print $1}')"
            if [[ ! "$expected_sha" =~ ^[a-f0-9]{64}$ || "$actual_sha" != "$expected_sha" ]]; then
              echo "::error::Published $name checksum does not match release notes."
              exit 1
            fi
            printf '%s=%s\n' "$arch" "$actual_sha" >> "$GITHUB_OUTPUT"
          done

      - name: Open or update tap Cask PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_CASK_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ github.ref_name }}
          ARM_SHA: ${{ steps.checksums.outputs.arm64 }}
          INTEL_SHA: ${{ steps.checksums.outputs.amd64 }}
          TAP_REPOSITORY: systembugtj/luban-homebrew
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          gh auth setup-git --hostname github.com
          TAP_DIR="$RUNNER_TEMP/luban-homebrew"
          gh repo clone "$TAP_REPOSITORY" "$TAP_DIR" -- --depth 1 --branch develop
          cd "$TAP_DIR"
          mkdir -p Casks
          node "$GITHUB_WORKSPACE/tools/render-buzz-cask.mjs" "$RELEASE_VERSION" "$ARM_SHA" "$INTEL_SHA" "$RUNNER_TEMP/buzz.rb"
          if cmp -s "$RUNNER_TEMP/buzz.rb" Casks/buzz.rb; then
            echo "Buzz Cask already matches $RELEASE_TAG on tap develop." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="release/buzz-${RELEASE_TAG}"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi
          node "$GITHUB_WORKSPACE/tools/render-buzz-cask.mjs" "$RELEASE_VERSION" "$ARM_SHA" "$INTEL_SHA" Casks/buzz.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add Casks/buzz.rb
            git commit -m "chore(cask): update Buzz ${RELEASE_TAG}"
            git push --set-upstream origin "$branch"
          fi
          existing_pr="$(gh pr list --repo "$TAP_REPOSITORY" --head "systembugtj:$branch" --base develop --state open --json number --jq '.[0].number // empty')"
          body="Update Buzz.app Cask to ${RELEASE_TAG}. Both architecture-specific DMGs were downloaded from the published signed release and their SHA-256 checksums match its release notes."
          printf '%s\n' "$body" > "$RUNNER_TEMP/cask-pr-body.md"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --repo "$TAP_REPOSITORY" --title "chore(cask): update Buzz ${RELEASE_TAG}" --body-file "$RUNNER_TEMP/cask-pr-body.md"
            echo "Updated Homebrew Cask PR #$existing_pr." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --repo "$TAP_REPOSITORY" --head "systembugtj:$branch" --base develop \
              --title "chore(cask): update Buzz ${RELEASE_TAG}" --body-file "$RUNNER_TEMP/cask-pr-body.md"
          fi

  retag-release-pr:
    name: Mark version PR released
    needs: [verify-release]
    if: needs.verify-release.outputs.verified == 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark merged Release Please PRs as tagged
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh label view "autorelease: tagged" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh label create "autorelease: tagged" --repo "$REPOSITORY" --color EDEDED
          fi
          gh pr list --repo "$REPOSITORY" --base develop --state merged \
            --label "autorelease: pending" --json number --jq '.[].number' > "$RUNNER_TEMP/release-prs.txt"
          while IFS= read -r number; do
            [[ -z "$number" ]] && continue
            gh pr edit "$number" --repo "$REPOSITORY" \
              --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          done < "$RUNNER_TEMP/release-prs.txt"
          echo "Release version PR labels reconciled after asset verification." >> "$GITHUB_STEP_SUMMARY"
